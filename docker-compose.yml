services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blog}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    volumes:
      - ./:/var/www
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-blog}
      DB_USER: ${MYSQL_USER:-blog}
      DB_PASS: ${MYSQL_PASSWORD:-blog}
      APP_DEBUG: ${APP_DEBUG:-false}
      SEED_CATEGORIES: ${SEED_CATEGORIES:-50}
      SEED_ARTICLES_MIN: ${SEED_ARTICLES_MIN:-30}
      SEED_ARTICLES_MAX: ${SEED_ARTICLES_MAX:-90}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  sass:
    image: node:20-alpine
    volumes:
      - ./:/app
    working_dir: /app
    entrypoint: ["/bin/sh", "/app/docker/node/compile.sh"]

volumes:
  db-data: